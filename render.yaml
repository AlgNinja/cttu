# Render Blueprint specification for CTTU / FocusFlow
# Learn more: https://render.com/docs/blueprint-spec

services:
  # ============================================================================
  # Backend Web Service (Node.js + Express + Prisma)
  # ============================================================================
  - type: web
    name: cttu-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Supabase Connection Strings
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # Clerk Authentication Keys
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false

      # Frontend Origin for CORS (e.g., https://cttu-frontend.onrender.com)
      - key: CORS_ORIGIN
        sync: false

  # ============================================================================
  # Frontend Static Site (React + Vite SPA)
  # ============================================================================
  - type: web
    name: cttu-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: dist
    routes:
      # SPA Rewrite: Ensures client-side routing & page refreshes work properly
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Skip Render's automatic pre-install step so it doesn't freeze or run twice
      - key: SKIP_INSTALL_DEPS
        value: "true"

      # Clerk Publishable Key (embedded into static bundle at build time)
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false

      # Backend API Base URL (e.g., https://cttu-backend.onrender.com/api)
      - key: VITE_API_URL
        sync: false
